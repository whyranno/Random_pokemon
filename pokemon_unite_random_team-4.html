<html lang="ko">

<title>돌려돌려 너의 포켓몬!</title>
<style>
  :root { --bg: #fff5f8; --text: #5a4a5a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #fff5f8 0%, #f0f8ff 50%, #fff9e6 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }
  .container { max-width: 920px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #ff6b9d;
    font-size: 2rem;
    margin: 8px 0;
    text-shadow: 1px 1px 0 #fff;
  }
  .subtitle { text-align: center; color: #a07a8a; margin-bottom: 20px; font-size: 0.9rem; }
  .btn-wrap { text-align: center; margin-bottom: 20px; }
  button {
    background: linear-gradient(90deg, #ff9eb5, #ffb6c1);
    color: #5a4a5a;
    border: 3px solid #fff;
    padding: 12px 28px;
    font-size: 1.05rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 0 #ff6b9d;
  }
  button:hover { transform: translateY(-2px); }
  .map {
    display: grid;
    gap: 14px;
    background: rgba(255,255,255,0.75);
    border-radius: 20px;
    padding: 16px;
    border: 3px solid #ffd6e0;
  }
  .lane { border-radius: 16px; padding: 14px; min-height: 110px; }
  .top { background: linear-gradient(135deg, #e3f2fd, #bbdefb); }
  .center { background: linear-gradient(135deg, #fff9c4, #fff59d); }
  .bottom { background: linear-gradient(135deg, #fce4ec, #f8bbd0); }
  .lane-title { font-weight: bold; margin-bottom: 8px; }
  .pokemon-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .poke-card {
    background: #fff;
    border-radius: 14px;
    padding: 10px;
    flex: 1;
    min-width: 120px;
    text-align: center;
    border: 2px solid #ffd6e0;
    position: relative;
    box-shadow: 0 2px 0 #ffeaa7;
  }
  .role-icon {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid #ffd6e0;
    background: #fff;
    object-fit: cover;
  }
  .poke-sprite {
    width: 80px;
    height: 80px;
    margin: 6px auto 4px;
    display: block;
    object-fit: contain;
  }
  .poke-name { font-weight: bold; color: #ff6b9d; margin: 4px 0; font-size: 0.95rem; }
  .poke-role {
    font-size: 0.72rem;
    background: #fff0f5;
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
  }
  .empty { color: #d4a5b5; text-align: center; padding: 16px; }
  .stats { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat { background: #fff; padding: 5px 10px; border-radius: 14px; border: 2px solid #ffd6e0; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🎲 돌려돌려 너의 포켓몬!</h1>
  <p class="subtitle">위: 밸런스/어택/스피드 + 서포트/디펜스 &nbsp;|&nbsp; 중앙: 딜러 &nbsp;|&nbsp; 아래: 서포트/디펜스 + 밸런스/어택/스피드</p>
  <div class="stats" id="stats"></div>
  <div class="btn-wrap">
    <button onclick="rollTeam()">🎲 랜덤 돌리기</button>
  </div>
  <div class="map">
    <div class="lane top">
      <div class="lane-title">🔵 위 에리어</div>
      <div class="pokemon-grid" id="top-lane"><div class="empty">버튼을 눌러 배치하세요</div></div>
    </div>

    </div>

      <div class="pokemon-grid" id="bottom-lane"><div class="empty">버튼을 눌러 배치하세요</div></div>
    </div>
  </div>
</div>

function getRandomFromPool(pool, exclude = []) {
  const available = pool.filter(p => !exclude.includes(p.name));
  if (available.length === 0) return pool[Math.floor(Math.random() * pool.length)];
  return available[Math.floor(Math.random() * available.length)];
}

function createCard(poke) {
  const role = roleNames[poke.role];
  let spriteUrl = poke.isLocal ? poke.sprite : `https://play.pokemonshowdown.com/sprites/gen5/${poke.sprite}.png`;
  const iconSrc = roleIcons[poke.role] || "";
  return `
    <div class="poke-card">
      ${iconSrc ? `<img class="role-icon" src="${iconSrc}" alt="">` : ""}
      <div class="poke-name">${poke.name}</div>
      <img class="poke-sprite" src="${spriteUrl}" alt="${poke.name}" onerror="this.style.display='none'">
      <div class="poke-role">${role}</div>
    </div>
  `;
}

function updateStats() {
  const counts = { allrounder: 0, supporter: 0, defender: 0, attacker: 0, speedster: 0 };
  pokemonList.forEach(p => counts[p.role]++);
  document.getElementById("stats").innerHTML = `
    <div class="stat">총 ${pokemonList.length}마리</div>
    <div class="stat">밸런스 ${counts.allrounder}</div>
    <div class="stat">서포트 ${counts.supporter}</div>
    <div class="stat">디펜스 ${counts.defender}</div>
    <div class="stat">어택 ${counts.attacker}</div>
    <div class="stat">스피드 ${counts.speedster}</div>
  `;
}

function rollTeam() {
  const used = [];
  const damageRoles = ["allrounder", "attacker", "speedster"];
  const supportRoles = ["supporter", "defender"];
  const damagePool = pokemonList.filter(p => damageRoles.includes(p.role));
  const supportPool = pokemonList.filter(p => supportRoles.includes(p.role));

  const top1 = getRandomFromPool(damagePool, used); used.push(top1.name);
  const top2 = getRandomFromPool(supportPool, used); used.push(top2.name);
  const bot1 = getRandomFromPool(supportPool, used); used.push(bot1.name);
  const bot2 = getRandomFromPool(damagePool, used); used.push(bot2.name);

  const centerPool = [
    ...damagePool.filter(p => !["갸라도스", "메가갸라도스"].includes(p.name)),
    ...urshifuForms
  ];
  const center = getRandomFromPool(centerPool, used);

  document.getElementById("top-lane").innerHTML = createCard(top1) + createCard(top2);
  document.getElementById("center-lane").innerHTML = createCard(center);
  document.getElementById("bottom-lane").innerHTML = createCard(bot1) + createCard(bot2);
}

updateStats();
</script>
